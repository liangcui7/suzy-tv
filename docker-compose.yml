services:
  suzy-tv:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      VIDEO_DATA_DIR: /data
      VIDEO_STATIC_DIR: /app/dist
    volumes:
      - suzy-tv-data:/data
    ports:
      - "8080:8080"

volumes:
  suzy-tv-data:
